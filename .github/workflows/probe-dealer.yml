name: probe-dealer

on:
  push:
    branches: [main]
    paths:
      - "scripts/probe_dealer.py"
      - ".github/workflows/probe-dealer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Probe dealer pages
        run: python scripts/probe_dealer.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git commit -m "probe: 販売所ページの記録" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
