name: probe-race
on:
  push:
    branches: [probe-race]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q lhasa >/dev/null
      - run: mkdir -p probe/out && (python3 probe/kd_probe.py > probe/out/log.txt 2>&1 || true)
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/out && git commit -m "probe結果" && git push origin probe-race
