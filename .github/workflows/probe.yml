name: probe-apis

on:
  push:
    branches: [main]
    paths:
      - "scripts/probe_apis.py"
      - ".github/workflows/probe.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *" # 6時間ごと(テスト期間中のみ)

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe APIs
        run: python scripts/probe_apis.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git commit -m "probe: API応答の記録" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
