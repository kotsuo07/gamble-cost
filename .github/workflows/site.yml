name: collect-and-deploy

on:
  schedule:
    # JST 0:07 / 6:07 / 12:07 / 18:07
    - cron: "7 15,21,3,9 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  workflow_dispatch:
    inputs:
      collect:
        description: "データ取得も行う"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect prices
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect) || contains(github.event.head_commit.message, '[collect]')
        run: |
          python scripts/collect.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: 価格を計測" || true
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
      - name: Build site
        run: |
          pip install -q jinja2 markdown pyyaml
          python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
